name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --ignore=tests/smoke.py
        env:
          DOGFOOD_DEV_TOKENS: "1"
          DOGFOOD_WEBHOOK_WORKER: "0"
          PYTHONPATH: src
      - run: python -m dogfood export-openapi docs/openapi.json.generated
        env:
          PYTHONPATH: src
      - run: diff -q docs/openapi.json docs/openapi.json.generated

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start portal and run smoke
        env:
          DOGFOOD_DEV_TOKENS: "1"
          PYTHONPATH: src
        run: |
          python -m dogfood init
          python -m dogfood serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health
          python tests/smoke.py http://127.0.0.1:8080
