name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --ignore=tests/smoke.py
        env:
          DOGFOOD_DEV_TOKENS: "1"
          PYTHONPATH: src
      - run: python -m dogfood export-openapi docs/openapi.json
        env:
          PYTHONPATH: src
      - run: test -f docs/openapi.json
