<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery embed</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { margin: 0; padding: 12px; background: var(--bg); }
    .embed-head { font-size: 14px; margin-bottom: 10px; color: var(--ink-faint); }
  </style>
</head>
<body>
  <div class="embed-head">{{ event.name }} · {{ total }} projects · <a href="{{ portal_url }}/projects?event={{ event.id }}" target="_blank" rel="noopener">Open full gallery</a></div>
  <div class="panel">
    {% for p in projects %}
      <div style="border-top:1px solid var(--line); padding:8px 0">
        <a href="{{ portal_url }}/projects/{{ p.id }}" target="_blank" rel="noopener"><b>{{ p.title }}</b></a>
        <div class="dim">{{ p.tagline or '' }}</div>
      </div>
    {% endfor %}
  </div>
</body>
</html>
